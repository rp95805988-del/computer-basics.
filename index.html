<html>
<head>
    <title>Frameset Example</title>
</head>

<frameset rows="25%,50%,25%">
    <frame src="top.html">
    
    <frameset cols="50%,50%">
        <frame src="left.html">
        <frame src="right.html">
    </frameset>
    
    <frame src="bottom.html">
</frameset>

</html>
